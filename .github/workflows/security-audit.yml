# Security audit — runs on every push and weekly on Sunday.
# doctor-web: fails on high or critical (all production deps are clean)
# doctor-app: fails on critical only — lodash.pick (no patched version exists)
#   and undici inside Firebase SDK (fix requires firebase major version upgrade,
#   which is a breaking change). These are tracked but not auto-blocked.
name: Security Audit

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0" # every Sunday at midnight UTC

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit doctor-web
        working-directory: doctor-web
        run: npm audit --audit-level=high --omit=dev

      - name: Audit doctor-app
        working-directory: doctor-app
        run: npm audit --audit-level=critical --omit=dev --legacy-peer-deps
