services:
  - type: web
    name: bookmydoc-backend
    env: node
    rootDir: doctor-web
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod:all
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      # LiveKit Credentials (MUST be set in Render dashboard)
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # OpenAI (for Voice Assistant)
      - key: OPENAI_API_KEY
        sync: false
